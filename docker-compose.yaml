services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start --db=postgres --db-url=jdbc:postgresql://keycloak_db:5432/keycloak --db-username=keycloak --db-password=keycloak
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/conf/cache-ispn.xml:/opt/keycloak/conf/cache-ispn.xml
      - keycloak_data:/opt/keycloak/data/cache
    environment:
      KC_CACHE: local
      KC_CACHE_CONFIG_FILE: /opt/keycloak/conf/cache-ispn.xml
      KC_CACHE_STACK: tcp
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: forwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_TRANSACTION_XA_ENABLED: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost:8080
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_IMPORT: /opt/keycloak/data/import/realm-export.json
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS: >-
        -Dinfinispan.stats=false
        -Dinfinispan.globalstate.enabled=true
        -Dorg.infinispan.unsupported.managerevents=true
        -Dinfinispan.cluster.stack=tcp
        -Djboss.default.jgroups.stack=tcp
        -Djgroups.udp.mcast_port=0
        -Dquarkus.index-dependency.jms.enabled=false
        -Dquarkus.index-dependency.artemis.enabled=false
        -Dquarkus.index-dependency.spring.enabled=false
        -Dquarkus.index-dependency.ant.enabled=false
        -Dquarkus.log.category."org.jgroups.protocols.UDP".level=ERROR
        -Dquarkus.log.category."org.infinispan.CONFIG".level=ERROR
    depends_on:
      keycloak_db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - backend-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run start:dev
    user: "node"
    volumes:
      - type: bind
        source: ./backend
        target: /usr/src/app
        consistency: delegated
      - /usr/src/app/node_modules
      - ./backend:/usr/src/app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "reports-realm"
      KEYCLOAK_CLIENT_ID: "reports-frontend"
      KEYCLOAK_CLIENT_SECRET: "qYX4EUAlEcIM1uUblvXGjooF6JNL1hmv"
      NODE_ENV: "development"
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
      - "9229:9229" #debugger тут
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - backend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://backend:3001  # Для запросов к API
      REACT_APP_KEYCLOAK_URL: http://keycloak:8080  # Для Docker-сети
      REACT_APP_KEYCLOAK_PUBLIC_URL: http://localhost:8080  # Для браузера
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    networks:
      - backend-network
    depends_on:
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  keycloak_data:

networks:
  backend-network:
    driver: bridge